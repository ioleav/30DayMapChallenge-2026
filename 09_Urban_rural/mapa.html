<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DEGURBA 2021</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    html, body, #map { height: 100%; margin: 0; background: #090E1C; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map', { center: [50, 10], zoom: 4, minZoom: 3, maxZoom: 11 });
    L.tileLayer('tiles_2021/{z}/{x}/{y}.png', {
      minNativeZoom: 3,
      maxNativeZoom: 9,
      attribution: 'Eurostat, DEGURBA 2021'
    }).addTo(map);
  </script>
</body>
</html>
